<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="rhynoxCyanGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#00C2BB" />
      <stop offset="100%" stop-color="#00968F" />
    </linearGradient>

    <linearGradient id="rhynoxSwooshGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="60%" stop-color="#00C2BB" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <filter id="rhynoxGlow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g id="rhynox-full-logo" fill="none" fill-rule="evenodd">
    <!-- ==================== RHYNOX TEXT ==================== -->
    <g id="rhynox-letters" fill="currentColor">
      <!-- R -->
      <path d="M 60 40 L 135 40 C 160 40 175 52 175 72 C 175 88 163 98 145 103 L 180 160 L 135 160 L 105 110 L 95 110 L 95 160 L 60 160 Z M 95 72 L 95 85 L 130 85 C 138 85 142 81 142 78 C 142 74 138 72 130 72 Z" />
      <!-- H -->
      <path d="M 195 40 L 232 40 L 232 82 L 278 82 L 278 40 L 315 40 L 315 160 L 278 160 L 278 118 L 232 118 L 232 160 L 195 160 Z" />
      <!-- Y -->
      <path d="M 330 40 L 370 40 L 400 90 L 430 40 L 470 40 L 420 108 L 420 160 L 380 160 L 380 108 Z" />
      <!-- N -->
      <path d="M 485 40 L 522 40 L 565 115 L 565 40 L 602 40 L 602 160 L 565 160 L 522 85 L 522 160 L 485 160 Z" />
      <!-- X -->
      <path d="M 790 40 L 832 40 L 865 92 L 898 40 L 940 40 L 890 98 L 945 160 L 902 160 L 865 105 L 828 160 L 785 160 L 840 98 Z" />
    </g>

    <!-- ==================== RHINO BADGE ('O') ==================== -->
    <g id="rhino-badge-o" transform="translate(683, 100)">
      <circle cx="0" cy="0" r="62" fill="url(#rhynoxCyanGrad2)" />
      <path fill="#FFFFFF" d="
        M -24 30 
        C -36 14 -35 -2 -22 -14 
        C -16 -20 -10 -25 -2 -27 
        C 4 -38 18 -46 32 -42 
        C 25 -32 17 -24 10 -16 
        C 18 -22 28 -26 35 -22 
        C 26 -14 18 -7 13 -3 
        C 16 5 19 14 17 21 
        C 12 18 7 16 2 16 
        C 10 27 18 40 32 48 
        C 14 56 -10 50 -24 30 Z
      " />
      <circle cx="2" cy="-6" r="2.5" fill="#00C2BB" />
    </g>

    <!-- ==================== DUAL SWOOSH WAVES ==================== -->
    <path d="M 55 130 C 200 95, 380 90, 520 102 C 600 108, 640 100, 680 75 C 700 62, 715 50, 725 40" 
          fill="none" stroke="url(#rhynoxSwooshGrad2)" stroke-width="7" stroke-linecap="round" filter="url(#rhynoxGlow2)" />

    <path d="M 485 132 C 540 135, 590 148, 620 148 C 645 148, 660 135, 672 110" 
          fill="none" stroke="url(#rhynoxSwooshGrad2)" stroke-width="6" stroke-linecap="round" filter="url(#rhynoxGlow2)" />

    <!-- ==================== TECHNOLOGIES TEXT & CIRCUIT ==================== -->
    <g id="circuit-left-nodes" fill="#00C2BB" stroke="#00C2BB">
      <circle cx="160" cy="195" r="4" />
      <circle cx="178" cy="215" r="4" />
      <circle cx="195" cy="235" r="4" />
      <path d="M 160 195 L 178 195 L 195 215" stroke-width="2" fill="none" />
      <path d="M 178 215 L 210 215" stroke-width="2" fill="none" />
      <path d="M 195 235 L 290 235" stroke-width="2" fill="none" />
    </g>

    <text x="215" y="222" 
          font-family="'Inter', 'Rajdhani', 'Orbitron', -apple-system, sans-serif" 
          font-weight="900" 
          font-size="34" 
          letter-spacing="15" 
          fill="currentColor">TECHNOLOGIES</text>

    <g id="circuit-bottom-line" stroke="#00C2BB" stroke-width="2.5" fill="none">
      <path d="M 295 240 L 805 240 L 830 240" stroke-linecap="round" />
      <path d="M 445 240 L 460 258 L 740 258" stroke-linecap="round" />
      <circle cx="295" cy="240" r="4" fill="#00C2BB" />
      <circle cx="445" cy="240" r="4" fill="#00C2BB" />
      <circle cx="460" cy="258" r="4.5" fill="#00C2BB" />
      <circle cx="535" cy="258" r="4.5" fill="#0A1B2E" stroke="#00C2BB" stroke-width="2" />
      <circle cx="740" cy="258" r="4" fill="#00C2BB" />
      <circle cx="830" cy="240" r="4" fill="#00C2BB" />
    </g>
  </g>
</svg>